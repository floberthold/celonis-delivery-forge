components:
  schemas:
    ExceptionReference:
      type: object
      properties:
        reference:
          type: string
        message:
          type: string
        shortMessage:
          type: string
    FrontendHandledBackendError:
      type: object
      properties:
        frontendErrorKey:
          type: string
        errorInformation:
          type: object
    FinalModelOptions:
      type: object
      properties:
        withVariableReplacement:
          type: boolean
        withAutogeneratedDataModelData:
          type: boolean
        withDefaultValues:
          type: boolean
        validatePql:
          type: boolean
        withUnknownVariablesValidation:
          type: boolean
        withResolvedScopes:
          type: boolean
    YamlMetadata:
      required:
      - content
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        parentNodeId:
          type: string
        finalModelOptions:
          $ref: '#/components/schemas/FinalModelOptions'
        content:
          type: string
        visualEditorValidation:
          type: boolean
    AssetMetadataTransport:
      type: object
      properties:
        usedVariables:
          type: array
          items:
            $ref: '#/components/schemas/VariableDefinition'
        relatedAssets:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/RelatedAsset'
        assetUsages:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AssetUsage'
        metadata:
          $ref: '#/components/schemas/JsonNode'
        hidden:
          type: boolean
    AssetUsage:
      type: object
      properties:
        objectId:
          type: string
        targetObjects:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/TargetUsageMetadata'
    CascadeType:
      type: string
      enum:
      - DELETE
    ContentNodeBaseTransport:
      type: object
      properties:
        reference:
          type: string
        version:
          type: string
        external:
          type: boolean
    ContentNodeTransport:
      type: object
      properties:
        permissions:
          uniqueItems: true
          type: array
          items:
            type: string
        tenantId:
          type: string
        id:
          type: string
        key:
          type: string
        name:
          type: string
        rootNodeKey:
          type: string
        base:
          $ref: '#/components/schemas/ContentNodeBaseTransport'
        assetType:
          type: string
        nodeType:
          $ref: '#/components/schemas/ContentNodeType'
        parentNodeKey:
          type: string
        parentNodeId:
          type: string
        invalidContent:
          type: boolean
        serializedContent:
          type: string
        serializationType:
          type: string
        draftId:
          type: string
        workingDraftId:
          type: string
        activatedDraftId:
          type: string
        showInViewerMode:
          type: boolean
        publicAvailable:
          type: boolean
        embeddable:
          type: boolean
        rootNodeId:
          type: string
        order:
          type: integer
          format: int32
        source:
          type: string
        assetMetadataTransport:
          $ref: '#/components/schemas/AssetMetadataTransport'
        spaceId:
          type: string
        changeDate:
          type: string
          format: date-time
