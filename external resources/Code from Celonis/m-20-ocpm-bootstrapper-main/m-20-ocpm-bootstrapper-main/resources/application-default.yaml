app:
  ddtrace_enabled: false
  openapi_url: "/api/public/openapi.json"
  docs_url: "/api/public/docs"
  redoc_url: "/api/public/redoc"
  transform_openapi_spec: true

realm: dev

python_core:
  data_source:
    url: postgresql+asyncpg://localhost:5432/pig-compability-wrapper
  rabbit_mq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  vector:
    url: http://localhost:19530/

logging:
  root:
    level: "INFO"
    handlers: ["default"]
  loggers:
    app:
      handlers: ["default"]
      level: "DEBUG"
      propagate: False
  formatters:
    default:
      format: "[%(asctime)s] - %(levelname)s - %(name)s: %(message)s"

celonis:
  services:
    team:
      url: http://localhost:8080
    integration:
      url: http://localhost:8082/integration
    package-manager:
      url: http://localhost:8102/package-manager
    semantic-layer:
      url: http://localhost:8075/semantic-layer
    machine-learning:
      url: http://localhost:8099/machine-learning
    backend:
      url: http://localhost:8090/backend

proxy:
  port: 9011
  gateway_port: 9010
  namespace: develop
  services:
    integration:
    - local_port: 8082
      remote_port: 80
    team:
    - local_port: 8080
      remote_port: 80
    package-manager:
    - local_port: 8102
      remote_port: 80
    semantic-layer:
    - local_port: 8075
      remote_port: 80
    machine-learning:
    - local_port: 8099
      remote_port: 80
    backend:
    - local_port: 8090
      remote_port: 80
    ems-rabbitmq-cluster:
    - local_port: 5672
      remote_port: 5672
