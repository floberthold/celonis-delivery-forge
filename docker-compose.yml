version: "3.9"
services:
  db:
    image: postgres:16
    container_name: foundry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: foundry-api
    env_file:
      - .env
    environment:
      FORGE_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/foundry
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["uvicorn", "foundry.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
