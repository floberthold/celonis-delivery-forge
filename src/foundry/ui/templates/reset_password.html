{% extends "base.html" %}

{% block title %}Reset Password | Foundry{% endblock %}

{% block content %}
<h2>Reset Password</h2>

{% if error_message %}
<div class="alert error">{{ error_message }}</div>
{% endif %}

<section class="panel login-panel">
    {% if not error_message %}
    <form class="form-card" method="post" action="/reset-password">
        <input type="hidden" name="token" value="{{ token }}">
        <label>New Password
            <input type="password" name="password" minlength="10" required>
        </label>
        <label>Confirm Password
            <input type="password" name="confirm_password" minlength="10" required>
        </label>
        <button type="submit">Update Password</button>
    </form>
    {% endif %}

    <div class="login-guide">
        <p class="muted-note"><a href="/forgot-password">Request a new reset link</a></p>
        <p class="muted-note"><a href="/login">Back to login</a></p>
    </div>
</section>
{% endblock %}
