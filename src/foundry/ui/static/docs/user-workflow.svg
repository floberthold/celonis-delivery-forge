<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="User delivery workflow">
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="36" y="46" fill="#1b2230" font-size="30" font-family="Segoe UI" font-weight="700">Celonis Delivery Workflow</text>
  <text x="36" y="76" fill="#57627a" font-size="16" font-family="Segoe UI">Plan → Build → Review → Audit</text>

  <rect x="40" y="120" width="170" height="90" rx="12" fill="#f1f4fa" stroke="#2e4a82" stroke-width="2"/>
  <text x="125" y="157" text-anchor="middle" fill="#1b2230" font-size="17" font-family="Segoe UI">Project Setup</text>
  <text x="125" y="181" text-anchor="middle" fill="#57627a" font-size="13" font-family="Segoe UI">Clients + Members</text>

  <rect x="270" y="120" width="170" height="90" rx="12" fill="#f1f4fa" stroke="#2e4a82" stroke-width="2"/>
  <text x="355" y="157" text-anchor="middle" fill="#1b2230" font-size="17" font-family="Segoe UI">Asset Delivery</text>
  <text x="355" y="181" text-anchor="middle" fill="#57627a" font-size="13" font-family="Segoe UI">Build / Update</text>

  <rect x="500" y="120" width="170" height="90" rx="12" fill="#f1f4fa" stroke="#2e4a82" stroke-width="2"/>
  <text x="585" y="157" text-anchor="middle" fill="#1b2230" font-size="17" font-family="Segoe UI">Review Submit</text>
  <text x="585" y="181" text-anchor="middle" fill="#57627a" font-size="13" font-family="Segoe UI">Author Action</text>

  <rect x="730" y="120" width="170" height="90" rx="12" fill="#e8f8ee" stroke="#19633a" stroke-width="2"/>
  <text x="815" y="157" text-anchor="middle" fill="#1b2230" font-size="17" font-family="Segoe UI">Decision Gate</text>
  <text x="815" y="181" text-anchor="middle" fill="#57627a" font-size="13" font-family="Segoe UI">Approve / Rework</text>

  <rect x="960" y="120" width="190" height="90" rx="12" fill="#f1f4fa" stroke="#2e4a82" stroke-width="2"/>
  <text x="1055" y="157" text-anchor="middle" fill="#1b2230" font-size="17" font-family="Segoe UI">Timeline Audit</text>
  <text x="1055" y="181" text-anchor="middle" fill="#57627a" font-size="13" font-family="Segoe UI">Evidence + Trace</text>

  <line x1="210" y1="165" x2="270" y2="165" stroke="#2e4a82" stroke-width="3"/>
  <line x1="440" y1="165" x2="500" y2="165" stroke="#2e4a82" stroke-width="3"/>
  <line x1="670" y1="165" x2="730" y2="165" stroke="#2e4a82" stroke-width="3"/>
  <line x1="900" y1="165" x2="960" y2="165" stroke="#2e4a82" stroke-width="3"/>
  <polygon points="265,159 275,165 265,171" fill="#2e4a82"/>
  <polygon points="495,159 505,165 495,171" fill="#2e4a82"/>
  <polygon points="725,159 735,165 725,171" fill="#2e4a82"/>
  <polygon points="955,159 965,165 955,171" fill="#2e4a82"/>

  <rect x="40" y="260" width="1110" height="140" rx="12" fill="#f5f7fb" stroke="#dfe4ee"/>
  <text x="62" y="292" fill="#1b2230" font-size="18" font-family="Segoe UI" font-weight="700">4-Eyes Governance Controls</text>
  <text x="62" y="324" fill="#1b2230" font-size="15" font-family="Segoe UI">• Reviewer must be different from author.</text>
  <text x="62" y="350" fill="#1b2230" font-size="15" font-family="Segoe UI">• Project activation requires at least 2 active memberships.</text>
  <text x="62" y="376" fill="#1b2230" font-size="15" font-family="Segoe UI">• Review outcomes and changes must appear in timeline events.</text>
</svg>
